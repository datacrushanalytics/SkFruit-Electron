<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit History</title>
    <link rel="stylesheet" href="../assets/css/report.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div id="loader"></div>
    <div class="container">
        <h1>Edit History - Sales & Receipts</h1>
        <hr>
        
        <div class="filter-section">
            <div class="input-wrapper">
                <label for="startDate">From Date:</label>
                <input type="date" id="startDate" required>
            </div>
            
            <div class="input-wrapper">
                <label for="endDate">To Date:</label>
                <input type="date" id="endDate" required>
            </div>
            
            <div class="input-wrapper">
                <label for="filterType">Type:</label>
                <select id="filterType">
                    <option value="all">All</option>
                    <option value="sale">Sales Only</option>
                    <option value="receipt">Receipts Only</option>
                </select>
            </div>
            
            <button type="button" onclick="fetchEditHistory()" class="btn-search">Search</button>
            <button type="button" onclick="window.location.href='./Menu.html'" class="btn-back">Back</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Bill/Receipt No</th>
                        <th>Customer</th>
                        <th>Product/Details</th>
                        <th>Old Qty</th>
                        <th>New Qty</th>
                        <th>Edited By</th>
                        <th>Edit Time</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="9" style="text-align: center;">Select date range and click Search</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set default dates to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
        });

        async function fetchEditHistory() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const filterType = document.getElementById('filterType').value;
            
            if (!startDate || !endDate) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Missing Dates',
                    text: 'Please select both start and end dates'
                });
                return;
            }

            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            try {
                const response = await fetch('http://94.136.190.129:3000/editHistory/fetch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        startDate,
                        endDate,
                        type: filterType
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch edit history');
                }

                const data = await response.json();
                loader.style.display = 'none';
                populateTable(data);
            } catch (error) {
                loader.style.display = 'none';
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Failed to fetch edit history'
                });
            }
        }

        function populateTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">No edit history found</td></tr>';
                return;
            }

            data.forEach(item => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${formatDate(item.edit_date)}</td>
                    <td>${item.type}</td>
                    <td>${item.bill_no}</td>
                    <td>${item.customer_name}</td>
                    <td>${item.product_details}</td>
                    <td>${item.old_quantity}</td>
                    <td>${item.new_quantity}</td>
                    <td>${item.edited_by}</td>
                    <td>${formatTime(item.edit_time)}</td>
                `;
            });
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN');
        }

        function formatTime(timeString) {
            if (!timeString) return '-';
            return new Date(timeString).toLocaleTimeString('en-IN');
        }
    </script>
</body>
</html>
