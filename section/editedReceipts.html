<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Edited Receipts</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fef7f7; margin: 0; padding: 20px; }
        .container { text-align: center; margin-bottom: 20px; }
        .date-filter { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; align-items: center; }
        .date-filter label { font-weight: bold; }
        .date-filter input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        .button { padding: 10px 20px; background-color: #26a653; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .button:hover { background-color: #1e8a43; }
        .table-container { max-width: 100%; overflow-x: auto; margin: 0 auto; max-height: calc(100vh - 200px); overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; background-color: rgba(255, 255, 255, 0.8); box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1); border-radius: 5px; }
        th, td { border: 1px solid #dddddd; text-align: left; padding: 12px; }
        th { background-color: #f2f2f2; }
        #loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loader"></div>
    <div class="container">
        <h1>Edited Receipts</h1>
        <hr>
        <div class="date-filter">
            <label for="startDate">From Date:</label>
            <input type="date" id="startDate">
            <label for="endDate">To Date:</label>
            <input type="date" id="endDate">
            <button class="button" onclick="fetchEditedReceipts()">Search</button>
            <a href="./Menu.html"><button class="button" style="background-color: #ff355f;">Back</button></a>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>No.</th><th>Receipt ID</th><th>Date</th><th>Customer Name</th><th>Mobile No</th><th>Cash</th><th>Online</th><th>Discount</th><th>In Carat</th><th>Remaining</th><th>Edited By</th><th>Edit Date</th><th>Edit Time</th><th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            fetchEditedReceipts();
        });
        function fetchEditedReceipts() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            if (!startDate || !endDate) { Swal.fire({ icon: 'error', title: 'Oops...', text: 'Please select both start and end dates' }); return; }
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            fetch('http://192.168.1.19:3000/editHistory/edited-receipts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ startDate, endDate }) })
            .then(response => { if (response.status === 404) { loader.style.display = 'none'; Swal.fire({ icon: 'info', title: 'No Data', text: 'No edited receipts found for the selected date range' }); document.getElementById('tableBody').innerHTML = ''; throw new Error('No data found'); } if (!response.ok) { throw new Error('Network response was not ok'); } return response.json(); })
            .then(data => { loader.style.display = 'none'; populateTable(data); })
            .catch(error => { loader.style.display = 'none'; console.error('Error:', error); });
        }
        function populateTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let counter = 1;
            data.forEach(item => {
                const row = tbody.insertRow();
                row.insertCell().textContent = counter++;
                row.insertCell().textContent = item.receipt_id;
                const dateCell = row.insertCell();
                const utcDate = new Date(item.date);
                dateCell.textContent = utcDate.toLocaleDateString('en-IN', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata' });
                row.insertCell().textContent = item.Customer;
                row.insertCell().textContent = item.mobile_no;
                row.insertCell().textContent = item.cash || 0;
                row.insertCell().textContent = item.online || 0;
                row.insertCell().textContent = item.discount || 0;
                row.insertCell().textContent = item.inCarat || 0;
                row.insertCell().textContent = item.remaining || 0;
                row.insertCell().textContent = item.edited_by;
                const editDateCell = row.insertCell();
                const editDate = new Date(item.edit_date);
                editDateCell.textContent = editDate.toLocaleDateString('en-IN', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata' });
                const editTimeCell = row.insertCell();
                if (item.edit_time) {
                    const editTime = new Date(item.edit_time);
                    editTimeCell.textContent = editTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
                } else {
                    editTimeCell.textContent = '-';
                }
                const statusCell = row.insertCell();
                statusCell.textContent = item.validate;
                if (item.validate === 'Verified') { row.style.backgroundColor = '#90EE90'; }
            });
        }
    </script>
</body>
</html>
